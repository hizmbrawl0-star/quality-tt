name: Build TikTok Quality tweak

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'QualityPatch.cpp'
      - 'QualityPatch.hpp'
      - 'Tweak.mm'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tweak:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build arm64 dylib for iPhone
        shell: bash
        run: |
          mkdir -p build
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          flags=(-std=c++17 -O2 -arch arm64 -isysroot "$sdk" -miphoneos-version-min=15.0)
          xcrun --sdk iphoneos clang++ "${flags[@]}" -Wall -Wextra -Werror -c QualityPatch.cpp -o build/QualityPatch.o
          xcrun --sdk iphoneos clang++ "${flags[@]}" -fobjc-arc -c Tweak.mm -o build/Tweak.o
          xcrun --sdk iphoneos clang++ "${flags[@]}" -dynamiclib \
            -install_name @rpath/TikTokQuality.dylib \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            build/QualityPatch.o build/Tweak.o -o build/TikTokQuality.dylib
      - name: Verify iOS dylib
        shell: bash
        run: |
          dylib=build/TikTokQuality.dylib
          xcrun lipo "$dylib" -verify_arch arm64
          metadata="$(xcrun vtool -show-build "$dylib")"
          printf '%s\n' "$metadata"
          grep -Eq '^[[:space:]]*platform[[:space:]]+IOS[[:space:]]*$' <<< "$metadata"
          install_name="$(xcrun otool -D "$dylib" | tail -n 1)"
          test "$install_name" = '@rpath/TikTokQuality.dylib'
      - uses: actions/upload-artifact@v7
        with:
          name: TikTokQuality
          path: build/TikTokQuality.dylib
          if-no-files-found: error
